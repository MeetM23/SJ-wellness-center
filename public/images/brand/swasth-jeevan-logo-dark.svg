<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- SWASTH JEEVAN BESPOKE EMBLEM (DARK BACKGROUND VARIANT) -->
  <g transform="translate(10, 8)">
    <!-- Soft circular backdrop -->
    <circle cx="32" cy="32" r="30" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    
    <!-- Left Leaf - Vibrant Growth -->
    <path d="M32 48 C 22 48 14 38 16 26 C 22 26 30 30 32 40 Z" fill="#D5DFD1"/>
    
    <!-- Right Leaf - Harmonious Life -->
    <path d="M32 48 C 42 48 50 38 48 26 C 42 26 34 30 32 40 Z" fill="#A7B9A1"/>
    
    <!-- Central Vitality Sprout / Stem -->
    <path d="M32 50 L32 20" stroke="#F8F7F1" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Radiant Vitality Spark (Jeevan / Life Essence) -->
    <circle cx="32" cy="15" r="3.5" fill="#E8B49B"/>
    <path d="M32 8 L32 11" stroke="#E8B49B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M26 12 L28 13.5" stroke="#E8B49B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M38 12 L36 13.5" stroke="#E8B49B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- TYPOGRAPHY: SWASTH JEEVAN WELLNESS CENTER -->
  <g transform="translate(86, 20)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#F8F7F1" letter-spacing="0.12em">SWASTH JEEVAN</text>
    
    <!-- Subtitle: WELLNESS CENTER -->
    <text x="1" y="42" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#D5DFD1" letter-spacing="0.28em">WELLNESS CENTER</text>
    
    <!-- Accent Line -->
    <rect x="1" y="47" width="180" height="1.5" rx="0.75" fill="#E8B49B" opacity="0.6"/>
  </g>
</svg>

